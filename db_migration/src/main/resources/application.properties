spring.application.name=db_migration
server.port=9091
# MySQL connection. Override these environment variables for your local setup.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_migration?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway applies versioned SQL files from classpath:db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Let Flyway manage the schema; Hibernate checks the resulting mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
